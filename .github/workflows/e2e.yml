# Unity ヘッドレスE2E検証 (PR ごと・手動実行も可)
#
# tools/verify.sh の4ステップ目(270件超のシナリオ)を CI でも回し、ローカルで実行し忘れた
# 変更を PR の段階で止める。
#
# 事前準備(リポジトリ管理者・1回のみ):
#   1. Unityライセンスファイル(.ulf)を用意する
#      Unity Hub でライセンスを有効化した PC の C:\ProgramData\Unity\Unity_lic.ulf(Windows)
#      / /Library/Application Support/Unity/Unity_lic.ulf(macOS)。詳細は
#      https://game.ci/docs/github/activation
#   2. リポジトリ Settings → Secrets and variables → Actions に UNITY_LICENSE として
#      .ulf の中身を貼り付け
#   3. Actionsタブ → E2E (Unity headless) → Run workflow で一度通ることを確かめる
#
# UNITY_LICENSE が未設定(またはフォークからのPR)のあいだは、失敗ではなく「スキップ」で終わる —
# 準備が済むまで PR が赤くならないように。
name: E2E (Unity headless)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/e2e.yml"

jobs:
  e2e:
    name: Run E2E scenario
    runs-on: ubuntu-latest
    # プロジェクトのUnityバージョン(ProjectSettings/ProjectVersion.txt)に合わせる。
    # イメージ一覧: https://hub.docker.com/r/unityci/editor/tags
    container: unityci/editor:ubuntu-6000.3.17f1-base-3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: unity-library-

      - name: Activate license and run E2E
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        shell: bash
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::notice::UNITY_LICENSE secret が未設定のため E2E をスキップしました (ワークフロー冒頭のコメント参照)"
            echo "E2E はスキップ: UNITY_LICENSE secret が未設定(またはフォークからのPR)" >> "$GITHUB_STEP_SUMMARY"
            touch /tmp/e2e.log
            exit 0
          fi
          echo "$UNITY_LICENSE" > /tmp/license.ulf
          unity-editor -batchmode -nographics -quit -manualLicenseFile /tmp/license.ulf -logFile /tmp/activate.log || true

          set +e
          unity-editor -batchmode -nographics -projectPath . \
            -executeMethod E2EScenarioRunner.Run -logFile /tmp/e2e.log
          code=$?
          set -e

          echo "── E2E results ──"
          grep "\[E2E\]" /tmp/e2e.log || echo "(no E2E markers — see full log below)"
          if [ $code -ne 0 ]; then
            echo "── tail of log ──"
            tail -50 /tmp/e2e.log
          fi
          exit $code

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-log
          path: /tmp/e2e.log
